name: Frozen TM Forum evidence integrity

on:
  pull_request:
    paths:
      - "scripts/verify_frozen_evidence.py"
      - ".github/workflows/verify-frozen-evidence.yml"
      - "MANIFEST.sha256"
      - "evidence/**"
      - "register.yaml"
      - "run-ids.txt"
  push:
    branches: [main]
    paths:
      - "scripts/verify_frozen_evidence.py"
      - ".github/workflows/verify-frozen-evidence.yml"
      - "MANIFEST.sha256"
      - "evidence/**"
      - "register.yaml"
      - "run-ids.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact-byte and bounded normalized-evidence verification
        run: python3 scripts/verify_frozen_evidence.py
